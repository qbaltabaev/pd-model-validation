[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pd-model-validation"
dynamic = ["version"]
description = "Transparent, reusable validation tools for probability-of-default models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PD Model Validation contributors"}]
keywords = ["credit-risk", "probability-of-default", "model-validation", "scorecard", "woe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.13",
  "pandas-stubs>=2.0",
]

[project.scripts]
pdvalidate = "pd_model_validation.cli:main"

[project.urls]
Homepage = "https://github.com/qbaltabaev/pd-model-validation"
Documentation = "https://github.com/qbaltabaev/pd-model-validation#readme"
Issues = "https://github.com/qbaltabaev/pd-model-validation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_model_validation"]

[tool.hatch.version]
path = "src/pd_model_validation/_version.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["pd_model_validation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
